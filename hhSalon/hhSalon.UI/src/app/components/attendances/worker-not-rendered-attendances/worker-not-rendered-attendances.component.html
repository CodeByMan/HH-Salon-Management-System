<div class="container">
    <div class="title-filter">
        <p class="title">Attendances {{workerName}}</p>
        <form class="filter" name="filter">
            <div><input (change)="filterNotPaid()" checked type="radio" name="attendance" id="not-paid"><label for="not-paid">Not Paid</label></div>
            <div><input (change)="filterIsPaid()" type="radio" name="attendance" id="is-paid"><label for="is-paid">Is Paid</label></div>
            <div><input (change)="filterAll()" type="radio" name="attendance" id="all"><label for="all">All</label></div>
        </form>
        <p *ngIf="attendances.length === 0">Empty</p>
    </div>
    <table *ngIf="attendances.length > 0" class="attendances-table">
        <thead><tr><th>Service</th><th>Group</th><th>Client</th><th>Date</th><th>Time</th><th>Chat</th><th>Paid</th><th>Completed</th></tr></thead>
        <tbody *ngFor="let attendance of attendances">
            <tr class="attendance-item">
                <td>{{attendance.service.name}}</td><td>{{attendance.group.name}}</td><td>{{attendance.client.firstName}}</td>
                <td>{{attendance.date | date}}</td><td>{{attendance.time | timeString}}</td>
                <td><a [routerLink]="['/chat', attendance.clientId]">Message</a></td>
                <td>{{attendance.isPaid}}</td>
                <td><select (change)="attendanceChanged(attendance)" [(ngModel)]="attendance.isRendered"><option value="No">No</option><option value="Yes">Yes</option></select></td>
            </tr>
        </tbody>
    </table>
</div>
